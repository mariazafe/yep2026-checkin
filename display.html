  .art img { position: relative; z-index: 1; display: block; width: calc(911px * var(--s)); height: calc(512px * var(--s)); margin: 0 auto;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(180deg, #000 86%, transparent 100%); -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(180deg, #000 86%, transparent 100%); mask-composite: intersect; }
  .wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; align-items: center; padding: 1vh 4vw 4vh; gap: 4vw; }
  body.cam .wrap { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }

  /* camera */
  .camwrap { display: none; position: relative; aspect-ratio: 4 / 3; max-height: 88vh; width: 100%; border-radius: 22px; overflow: hidden; background: #0c1312; border: 6px solid rgba(243, 233, 210, .25); transition: border-color .25s ease, box-shadow .25s ease; }
  body.cam .camwrap { display: block; }
  .camwrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .guide { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .guide i { width: 52%; aspect-ratio: 1; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(12, 19, 18, .38); border: 4px dashed rgba(243, 233, 210, .85); }
  .camlabel { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; text-align: center; font-size: clamp(18px, 1.8vw, 28px); font-weight: 700; background: rgba(12, 19, 18, .72); }
  .camwrap.scanned { border-color: #fff; box-shadow: 0 0 0 6px rgba(255, 255, 255, .35); }
  .camwrap.ok { border-color: var(--ok); box-shadow: 0 0 0 8px rgba(91, 191, 138, .35); }
  .camwrap.warn { border-color: var(--warn); box-shadow: 0 0 0 8px rgba(227, 165, 74, .35); }
  .camwrap.bad { border-color: var(--bad); box-shadow: 0 0 0 8px rgba(224, 128, 108, .35); }

  /* message */
  .msg { text-align: center; position: relative; min-height: 40vh; display: grid; place-items: center; }
  body.cam .msg { text-align: left; place-items: center start; }
  .scene { transition: opacity .4s ease, transform .4s ease; }
  .scene.hide { opacity: 0; transform: translateY(12px); position: absolute; pointer-events: none; }
  .eyebrow { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; color: var(--gold-soft); font-size: clamp(22px, 2.8vw, 44px); margin: 0 0 1vh; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(44px, 6.5vw, 120px); line-height: 1.02; margin: 0; }
  body.cam h1 { font-size: clamp(40px, 4.6vw, 88px); }
  .rule { width: 140px; height: 3px; background: var(--gold); margin: 3.5vh auto; border-radius: 3px; }
  body.cam .rule { margin-left: 0; }
  .sub { font-size: clamp(22px, 2.6vw, 40px); margin: 0; color: #DCE1DA; }
  .name { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(52px, 8vw, 160px); line-height: 1; margin: 1vh 0 0; color: #fff; overflow-wrap: anywhere; }
  body.cam .name { font-size: clamp(48px, 5.8vw, 120px); }
  .meta { font-size: clamp(20px, 2.3vw, 36px); color: var(--gold-soft); margin-top: 2.5vh; max-width: 28ch; }
  body:not(.cam) .meta { margin-left: auto; margin-right: auto; }
  .meta.walk { color: #F4CE92; }
  [hidden] { display: none !important; }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 14px; color: #7F8B88; transition: opacity .6s; }
  @media (prefers-reduced-motion: reduce) { .scene, .camwrap { transition: none; } }
</style>
</head>
<body>
<div class="art" id="art"><img src="yep2026-banner.png" alt="Modern Filipiniana. SMA Year End Party 2026" onerror="this.remove(); document.getElementById('kvText').hidden = false;"></div>
<div class="wrap">
  <div class="camwrap" id="camwrap">
    <video id="cam" autoplay muted playsinline></video>
    <div class="guide"><i></i></div>
    <div class="camlabel" id="camlabel">Hold your QR code inside the box</div>
  </div>
  <div class="msg">
    <div class="scene" id="idle">
      <div id="kvText" hidden><p class="eyebrow">Modern Filipiniana</p><h1>Year End Party 2026</h1><div class="rule"></div></div>
      <p class="sub" id="idleSub">Show your QR code at the booth to check in.</p>
    </div>
    <div class="scene hide" id="hello" aria-live="polite">
      <p class="eyebrow" id="helloEyebrow">Welcome</p>
      <div class="name" id="helloName"></div>
      <div class="meta" id="helloMeta"></div>
    </div>
  </div>
</div>
<p class="hint" id="hint">Drag this window to the second screen, then press F11 for full screen.</p>

<script>
const idle = document.getElementById('idle'), hello = document.getElementById('hello');
const camwrap = document.getElementById('camwrap'), video = document.getElementById('cam'), camlabel = document.getElementById('camlabel');
let timer, flashTimer;

function firstName(full) {
  const s = String(full || '').trim();
  if (s.indexOf(',') > -1) return (s.split(',')[1] || '').trim().split(/\s+/)[0] || s;
  return s.split(/\s+/)[0] || s;
}
function show(el) { [idle, hello].forEach(x => x.classList.toggle('hide', x !== el)); }
function frame(cls, label) {
  clearTimeout(flashTimer);
  camwrap.classList.remove('scanned', 'ok', 'warn', 'bad');
  if (cls) camwrap.classList.add(cls);
  camlabel.textContent = label || 'Hold your QR code inside the box';
}

/* ---------- size the textile header to the screen ---------- */
function fitArt() {
  const cam = document.body.classList.contains('cam');
  const s = Math.min(innerWidth * (cam ? 0.5 : 0.78) / 911, innerHeight * (cam ? 0.3 : 0.62) / 512);
  document.getElementById('art').style.setProperty('--s', s.toFixed(4));
}
addEventListener('resize', fitArt);
new MutationObserver(fitArt).observe(document.body, { attributes: true, attributeFilter: ['class'] });
fitArt();

/* ---------- live camera from the booth window ---------- */
function syncCamera() {
  let stream = null;
  try { if (window.opener && window.opener.yepGetStream) stream = window.opener.yepGetStream(); } catch (e) {}
  if (stream && video.srcObject !== stream) { video.srcObject = stream; video.play().catch(() => {}); }
  if (!stream && video.srcObject) video.srcObject = null;
  document.body.classList.toggle('cam', !!stream);
  document.getElementById('idleSub').textContent = stream ? 'Hold your QR code up to the camera to check in.' : 'Show your QR code at the booth to check in.';
}
setInterval(syncCamera, 2000);
syncCamera();

/* ---------- results from the booth ---------- */
function greet(m) {
  clearTimeout(timer);
  const E = document.getElementById('helloEyebrow'), N = document.getElementById('helloName'), M = document.getElementById('helloMeta');
  M.classList.remove('walk');
  let hold = 6000;
  if (m.outcome === 'checked_in') {
    E.textContent = m.kind === 'Guest' ? 'Welcome to SMA,' : 'Welcome,';
    N.textContent = firstName(m.name) + '!';
    M.textContent = m.kind === 'Guest' ? 'We\'re so glad you could join us.' : 'You\'re checked in. Enjoy the night.';
    frame('ok', 'Checked in');
  } else if (m.outcome === 'already') {
    E.textContent = 'Welcome back,';
    N.textContent = firstName(m.name) + '!';
    M.textContent = 'You\'re already checked in.';
    frame('ok', 'Already checked in');
  } else if (m.outcome === 'released') {
    E.textContent = 'Congratulations,';
    N.textContent = firstName(m.name) + '!';
    M.textContent = 'Enjoy your ' + (m.prize || 'prize') + '.';
    frame('ok', 'Prize released');
    hold = 8000;
  } else if (m.outcome === 'walk_in' || m.outcome === 'walked_in') {
    E.textContent = 'Welcome,';
    N.textContent = firstName(m.name) + '.';
    M.textContent = 'You\'re recorded as a walk-in. Since you didn\'t register, tonight\'s meals, merch and raffle aren\'t included for you.';
    M.classList.add('walk');
    frame('warn', 'Walk-in recorded');
    hold = 10000;
  } else {
    // not found, not registered or not attending: nothing personal on the public screen
    E.textContent = 'Almost there';
    N.textContent = 'One moment';
    M.textContent = 'Our booth staff will help you.';
    frame('bad', 'Please see our booth staff');
  }
  show(hello);
  timer = setTimeout(() => { show(idle); frame(''); }, hold);
}

if ('BroadcastChannel' in window) {
  new BroadcastChannel('yep26-display').onmessage = e => {
    const m = e.data || {};
    if (m.type === 'camera') setTimeout(syncCamera, 300);
    else if (m.type === 'scanned') { frame('scanned', 'Scanned. Checking…'); flashTimer = setTimeout(() => frame(''), 8000); }
    else greet(m);
  };
} else {
  document.getElementById('hint').textContent = 'This browser can\'t connect to the booth window. Use Chrome or Edge.';
}
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 15000);
document.addEventListener('fullscreenchange', () => { document.getElementById('hint').style.opacity = 0; });
</script>
</body>
</html>
